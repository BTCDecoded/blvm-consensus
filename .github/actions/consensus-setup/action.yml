name: Consensus setup
description: >
  Strip [patch.crates-io] + refresh blvm-spec.
  Run this immediately after actions/checkout in every job that
  compiles blvm-consensus, so the #[spec_locked] proc-macro always
  sees a current spec on self-hosted runners where the workspace
  directory persists between jobs.
  Note: actions/checkout must come first (local actions require the
  repo to already be checked out before they can be resolved).

runs:
  using: composite
  steps:
    - name: Strip [patch.crates-io] for crates.io-only CI
      uses: BTCDecoded/rust-ci/strip-patch-crates-io@main

    - name: Setup blvm-spec (for #[spec_locked] proc-macro)
      uses: BTCDecoded/rust-ci/setup-blvm-spec@main

    - name: Pin blvm-spec to the dispatched commit, or refresh main
      shell: bash
      env:
        SPEC_SHA: ${{ github.event.client_payload.source_sha }}
        SPEC_CONTENT_SHA256: ${{ github.event.client_payload.content_sha256 }}
      run: |
        # A spec push dispatches source_sha and the content hash of
        # PROTOCOL.md, ARCHITECTURE.md, and THE_ORANGE_PAPER.md. Check
        # that commit out and fail if the bytes do not match. Any other
        # run refreshes origin/main. Runners persist this checkout.
        set -euo pipefail
        if [ ! -d "../blvm-spec/.git" ]; then
          echo "blvm-spec checkout is missing"
          exit 1
        fi
        if [ -n "${SPEC_SHA:-}" ]; then
          git -C ../blvm-spec fetch --depth=1 origin "$SPEC_SHA"
          git -C ../blvm-spec checkout -f --detach FETCH_HEAD
          HEAD_SHA="$(git -C ../blvm-spec rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$SPEC_SHA" ]; then
            echo "blvm-spec HEAD ${HEAD_SHA} is not the dispatched commit ${SPEC_SHA}"
            exit 1
          fi
          echo "blvm-spec pinned to ${HEAD_SHA}"
        else
          git -C ../blvm-spec fetch --depth=1 origin main
          git -C ../blvm-spec checkout -f --detach FETCH_HEAD
          echo "blvm-spec HEAD: $(git -C ../blvm-spec rev-parse --short HEAD)"
        fi
        if [ -n "${SPEC_CONTENT_SHA256:-}" ]; then
          python3 scripts/check-spec-content-hash.py
        fi
